[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-inference-pipeline"
version = "0.3.1"
description = "LLM 推理链路优化 — Prefill/Decode 基准、Static/Paged KV Cache、GQA/MLA、Speculative Decoding；NumPy 可读参考 + PyTorch SDPA/AMP/compile 性能路径"
readme = "README.md"
requires-python = ">=3.10"

license = {text = "MIT"}
dependencies = [
    "numpy",
]

[project.optional-dependencies]
pytorch = [
    "torch>=2.0",
]
