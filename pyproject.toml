[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "transformer-attention"
version = "0.1.0"
description = "LLM 推理链路优化对照实现 — KV Cache、GQA/MLA 压缩、Speculative Decoding、StreamingLLM；Prefill/Decode 基准与 Cache/Decode 加速实验（NumPy/PyTorch，教学规模）"
readme = "README.md"
requires-python = ">=3.10"

license = {text = "MIT"}
dependencies = [
    "numpy",
]

[project.optional-dependencies]
pytorch = [
    "torch>=2.0",
]
