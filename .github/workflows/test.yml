name: CI

on: [push, pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
    - name: Install lint tools
      run: pip install flake8
    - name: Lint
      run: flake8 np_impl/ modern_llm/ pytorch/ experiments/ test_all.py console_io.py --max-line-length=200 --count

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        pip install numpy
    - name: Test
      run: python test_all.py
    - name: PyTorch suite (CPU)
      run: |
        pip install torch --extra-index-url https://download.pytorch.org/whl/cpu
        python pytorch/test_all.py
    - name: Benchmark (CPU)
      run: |
        pip install torch --extra-index-url https://download.pytorch.org/whl/cpu
        python -m experiments.benchmark_attention --seq_len 128 --warmup 2 --iter 5
        python -m experiments.benchmark_prefill_decode --prompt_len 64 --decode_steps 8 --warmup 2 --reps 5
        python -m experiments.benchmark_pytorch_optimized --prompt_len 32 --decode_steps 4 --d_model 64 --num_layers 1 --num_heads 4 --num_kv_heads 2 --warmup 1 --reps 2
        python -m experiments.compare_decoding_pytorch
    - name: Strict CUDA policy on CPU runner
      run: |
        pip install pytest
        python -m pytest tests/test_device_policy.py tests/test_release_evidence.py -q
        if python -m experiments.benchmark_prefill_decode --device cuda --require-cuda --warmup 1 --reps 1; then
          echo "expected --require-cuda to fail on CPU runner"
          exit 1
        fi

  test-windows:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install numpy
      run: pip install numpy
    - name: NumPy suites (no PYTHONIOENCODING)
      shell: powershell
      run: |
        Remove-Item Env:PYTHONIOENCODING -ErrorAction SilentlyContinue
        python test_all.py
